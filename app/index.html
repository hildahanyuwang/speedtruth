<!DOCTYPE html>
<meta charset="utf-8">
<title>SpeedTruth — speed-limit review queue</title>
<style>
:root{--ink:#11161c;--muted:#5f6b78;--neutral:#aab4bf;--high:#c0144c;--low:#2a78d6;
      --navy:#002569;--accent:#dd532c;--paper:#f4f6f8;--line:#dbe1e8;--band:#0b0f14}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:20px 28px 16px;background:var(--band);color:#fff;border-bottom:3px solid var(--navy)}
h1{margin:0 0 3px;font-size:18px;letter-spacing:.9px;text-transform:uppercase;font-weight:600}
.sub{color:#9fb0c2;font-size:12.5px}
header .sub{color:#9fb0c2}
.q{margin-top:12px;font-size:25px;font-weight:600;color:#fff;letter-spacing:-.2px}
.q:after{content:"";display:block;width:54px;height:3px;background:var(--accent);margin-top:10px}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(400px,1fr);gap:0;height:calc(100vh - 150px)}
.left{overflow:auto;border-right:1px solid var(--line)}
.right{overflow:auto;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:2}
select,input[type=search]{font:13px inherit;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:#fff}
label.chk{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:46px;background:#eef2f6;text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--navy);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr.row{cursor:pointer}
tr.row:hover{background:#fff}
tr.row.sel{background:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.photo{width:100%;border:1px solid var(--line);display:block}
.minimap{height:190px;border:1px solid var(--line);background:#eef2f6}
.cap{color:var(--muted);font-size:11.5px;margin-top:5px}
.pill{display:inline-block;background:var(--navy);color:#fff;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;padding:2px 8px;border-radius:2px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--neutral);color:var(--muted)}
.crit{color:var(--high);font-weight:600}
.card{padding:22px 24px}
.card h2{margin:0 0 2px;font-size:22px}
.card .where{color:var(--muted);font-size:13px;margin-bottom:16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;margin:14px 0}
.kv div:nth-child(odd){color:var(--muted)}
.block{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.block h3{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.block ol{margin:0;padding-left:18px}
.block li{margin-bottom:6px}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
a{color:var(--navy)}
button{font:13px inherit;padding:8px 14px;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:2px;cursor:pointer;letter-spacing:.3px}
button.ghost{background:#fff;color:var(--navy)}
button#export{background:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.35;cursor:default}
.basket{border-top:1px solid var(--line);padding:14px 24px;background:#eef2f6}
.basket ul{margin:8px 0;padding-left:18px;font-size:13px;color:var(--muted)}
footer{padding:12px 28px;border-top:3px solid var(--navy);color:var(--muted);font-size:11.5px;background:#fff;line-height:1.5}
.empty{padding:40px 24px;color:var(--muted)}
</style>

  const list = filtered();
  $('#count').textContent = fmt(list.length) + ' units';
  $('#rows').innerHTML = list.map(u => `
    <tr class="row ${selected && selected.id===u.id?'sel':''}" data-id="${u.id}">
      <td class="num">${u.rank}</td>
      <td>${u.road}<br><span class="tag">${u.region}</span> <span class="tag">${u.type}</span></td>
      <td class="num">${u.segs}</td>
      <td class="num">${u.km}</td>
      <td class="num ${u.crit?'crit':''}">${u.crit}</td>
      <td>${u.action}</td>
      <td class="num">${u.benefit}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="empty">Nothing matches that filter.</td></tr>';
  document.querySelectorAll('tr.row').forEach(tr =>
    tr.onclick = () => { selected = UNITS.find(u => u.id === tr.dataset.id); render(); card(); });
}

function card(){
  const u = selected; if(!u) return;
  const a = AUTH[u.region];
  const [lat, lon] = u.at.split(',');
  const ph = PHOTOS[u.id];
  const av = (id, label) => id
    ? ` · <a target="_blank" href="${PORTAL}/apps/mapviewer/index.html?webmap=${id}&center=${lon},${lat}&level=14">${label}</a>`
    : '';
  const arc = av(ARCGIS, 'open in ArcGIS') + av(ARCGIS_ROBUST, 'robustness layer');
  $('#card').className = 'card';
  $('#card').innerHTML = `
    <h2>${u.road}</h2>
    <div class="where"><span class="pill">${u.crit ? 'Critical segments present' : 'Flagged'}</span>
      &nbsp;${RNAME[u.region]} · ${u.type} · ranked ${u.rank} in ${RNAME[u.region]}</div>
    <div id="minimap" class="minimap"></div>
    <div class="cap">Inspect point ${u.at}${arc}</div>
    ${ph ? `<div class="block"><h3>The photograph the model read</h3>
      <img class="photo" src="../output/${ph[0]}" alt="Street-level view on or near this corridor"
           onerror="this.parentNode.style.display='none'">
      <div class="cap">${ph[2] === 'on this road' ? 'A frame on this road' : 'The nearest frame in this region'},
        ${ph[1]} km from the inspect point. It shows the corridor's condition, not necessarily this exact
        point. © Mapillary contributors, CC BY-SA.</div></div>` : ''}
    <div class="kv">
      <div>Flagged segments</div><div>${u.segs} (${u.crit} Critical, ${u.ser} Serious)</div>
      <div>Length</div><div>${u.km} km</div>
      <div>First action</div><div><b>${u.action}</b></div>
      <div>Cost tier</div><div>${u.tier} <span class="note">(as published in CORRIDORS.md)</span></div>
      <div>Avoidable-harm benefit</div><div>${u.benefit} <span class="note">relative index, not a casualty forecast</span></div>
      <div>BCR index</div><div>${u.bcr} <span class="note">from published intervention studies, not an evaluation of this road</span></div>
      <div>Inspect at</div><div>${u.at}
        · <a target="_blank" href="https://www.google.com/maps/@${lat},${lon},18z">map</a>
        · <a target="_blank" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}">street view</a>
        · <a target="_blank" href="https://www.mapillary.com/app/?lat=${lat}&lng=${lon}&z=17">Mapillary</a></div>
    </div>
    <div class="block">
      <h3>Who can change the limit</h3>
      <div><b>${a.title}</b></div>
      <ol>${a.lines.map(l => '<li>' + l + '</li>').join('')}</ol>
      <div class="note">${a.note}</div>
    </div>
    <div class="block">
      <h3>What this card does not say</h3>
      <div class="note">A flag means the limit deserves a review, not that the current limit is unlawful and not that a new limit can be published without a site check. Segment-level posted limits and probe speeds are confidential under the challenge data agreement and are not shown here. The benefit and BCR figures are relative ranking indices for sequencing work within this network, not monetary appraisals and not a valuation of casualties.</div>
    </div>
    <div class="block">
      <button id="add">Add to field-check list</button>
    </div>`;
  $('#add').onclick = () => {
    if(!basket.find(b => b.id === u.id)) basket.push(u);
    drawBasket();
  };
  if(window.L){
    const m = L.map('minimap', {scrollWheelZoom:false, attributionControl:true})
      .setView([+lat, +lon], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(m);
    const shape = SHAPES[u.id];
    if(shape){
      const line = L.polyline(shape, {color:'#c0144c', weight:4, opacity:.85}).addTo(m);
      m.fitBounds(line.getBounds(), {padding:[18,18]});
    }
    L.circleMarker([+lat, +lon], {radius:7, color:'#dd532c', weight:3,
      fillColor:'#fff', fillOpacity:1}).addTo(m)
      .bindTooltip('Suggested inspection point');
  } else {
    $('#minimap').innerHTML = '<div class="cap" style="padding:10px">' +
      'Map needs a connection. The coordinate below is the inspect point.</div>';
  }
}

function drawBasket(){
  $('#basket').innerHTML = basket.length
    ? basket.map(b => `<li>${b.road} — ${b.region}, ${b.segs} segs, ${b.at}</li>`).join('')
    : '<li>empty</li>';
  $('#export').disabled = !basket.length;
}

$('#export').onclick = () => {
  const head = 'road,region,unit_type,rank,segments,length_km,critical,first_action,' +
    'cost_tier,benefit_index_relative,bcr_index_relative,inspect_at\n';
  const body = basket.map(b => [b.road, b.region, b.type, b.rank, b.segs, b.km, b.crit,
    '"' + b.action + '"', b.tier, b.benefit, b.bcr, '"' + b.at + '"'].join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([head + body], {type:'text/csv'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'field_check_list.csv'; a.click();
  URL.revokeObjectURL(url);
};
$('#clear').onclick = () => { basket.length = 0; drawBasket(); };
['region','type','q','limitonly'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener(el.tagName === 'INPUT' && el.type === 'search' ? 'input' : 'change', render);
});
$('#foot').textContent = "Prototype built from the published outputs in speedtruth-submission/output/corridors_summary.csv. 14,711 segments scored of a 69,966-segment network; street imagery verified 3,537 of them (24% of the segments scored, about 5% of the full network) — everything outside that is screened, not verified. 1,473 segments are Priority 1; 481 of them stay Priority 1 under nearly any weighting and 992 depend on the weighting chosen. No restricted challenge data is included.";
render(); drawBasket();
</script>
